name: Release 1.0.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-programs
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/lv-programs/
          cd build
          zip -rq ../lv-programs-1.0.5.zip lv-programs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV Programs 1.0.5

          - Двухколоночная сетка сохранена, но карточки стали заметно компактнее.
          - Уменьшены высота карточек, внутренние отступы и размеры заголовков.
          - Фото занимает около 40% ширины карточки и растягивается на всю высоту.
          - Сетка переходит в один столбец на экранах уже 980 px и в вертикальные карточки на телефонах.
          EOF

          if gh release view v1.0.5 >/dev/null 2>&1; then
            echo 'Release v1.0.5 already exists; nothing to do.'
            exit 0
          fi

          gh release create v1.0.5 \
            lv-programs-1.0.5.zip \
            --target "$GITHUB_SHA" \
            --title "LV Programs 1.0.5" \
            --notes-file release-notes.md
