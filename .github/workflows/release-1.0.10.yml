name: Release 1.0.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.10.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -l lv-programs.php
          php -l includes/class-lvfp-plugin.php
          php -l includes/class-lvfp-admin.php

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-programs
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/lv-programs/
          cd build
          zip -rq ../lv-programs-1.0.10.zip lv-programs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV Programs 1.0.10

          - Типографика блока программ приведена к LV News Suite: основной шрифт PT Sans, заголовки PT Serif.
          - Размеры и межстрочные интервалы заголовков, описаний, рубрик, ссылок и кнопки синхронизированы со стилями новостей.
          - Красная анимированная полоска сверху карточек программ удалена.
          EOF

          if gh release view v1.0.10 >/dev/null 2>&1; then
            echo 'Release v1.0.10 already exists; nothing to do.'
            exit 0
          fi

          gh release create v1.0.10 \
            lv-programs-1.0.10.zip \
            --target "2288ee135e2b2796d69bef73d800d2e729fb38bc" \
            --title "LV Programs 1.0.10" \
            --notes-file release-notes.md
