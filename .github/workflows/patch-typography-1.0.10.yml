name: Align programs typography with news

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-typography-1.0.10.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply typography alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/frontend.css')
          css = css_path.read_text()

          replacements = {
              "\t-webkit-font-smoothing: antialiased;\n": "\tfont-family: 'PT Sans', Arial, sans-serif;\n\t-webkit-font-smoothing: antialiased;\n",
              "\tfont-family: Georgia, \"Times New Roman\", serif;\n\tfont-weight: 400;\n": "\tfont-family: 'PT Serif', Georgia, serif;\n\tfont-weight: 400;\n",
              "\tfont-size: clamp(32px, 4vw, 50px);\n\tline-height: 1.08;\n": "\tfont-size: clamp(30px, 3.6vw, 46px);\n\tline-height: 1.15;\n",
              "\tfont-size: clamp(15px, 1.25vw, 17px);\n\tline-height: 1.58;\n": "\tfont-size: 15px;\n\tline-height: 1.6;\n",
              "\tfont-family: Georgia, \"Times New Roman\", serif;\n\tfont-size: 46px;\n": "\tfont-family: 'PT Serif', Georgia, serif;\n\tfont-size: 46px;\n",
              "\tfont-size: 10px;\n\tfont-weight: 800;\n\tline-height: 1.2;\n\tletter-spacing: .11em;\n": "\tfont-size: 11px;\n\tfont-weight: 700;\n\tline-height: 1;\n\tletter-spacing: .08em;\n",
              "\tfont-size: clamp(24px, 2.15vw, 32px);\n\tline-height: 1.08;\n": "\tfont-size: 22px;\n\tline-height: 1.3;\n",
              "\tfont-size: 15px;\n\tline-height: 1.58;\n": "\tfont-size: 14px;\n\tline-height: 1.5;\n",
              "\tfont-size: 12px;\n\tfont-weight: 800;\n\tletter-spacing: .065em;\n": "\tfont-size: 12px;\n\tfont-weight: 700;\n\tline-height: 1.3;\n\tletter-spacing: .08em;\n",
              "\tfont-size: 13px;\n\tfont-weight: 700;\n\tline-height: 1.2;\n": "\tfont-size: 14px;\n\tfont-weight: 700;\n\tline-height: 1.2;\n",
              "\t\tfont-size: clamp(22px, 7vw, 28px);\n": "\t\tfont-size: 22px;\n",
              "\tletter-spacing: .12em;\n": "\tletter-spacing: .08em;\n",
          }

          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Expected CSS fragment not found: {old!r}')
              css = css.replace(old, new)

          red_bar = """.lvfp-card::before {
\tposition: absolute;
\tz-index: 6;
\ttop: 0;
\tleft: 0;
\twidth: 94px;
\theight: 6px;
\tbackground: var(--lvfp-red);
\tcontent: \"\";
\tpointer-events: none;
\ttransition: width .35s cubic-bezier(.2, .75, .2, 1);
}

"""
          red_hover = """.lvfp-card:hover::before {
\twidth: 156px;
}

"""
          for fragment in (red_bar, red_hover):
              if fragment not in css:
                  raise SystemExit('Expected red stripe CSS block not found')
              css = css.replace(fragment, '')

          css_path.write_text(css)

          plugin_path = Path('lv-programs.php')
          plugin = plugin_path.read_text()
          plugin = plugin.replace('Version:     1.0.9', 'Version:     1.0.10')
          plugin = plugin.replace("define( 'LVFP_VERSION', '1.0.9' );", "define( 'LVFP_VERSION', '1.0.10' );")
          if '1.0.10' not in plugin:
              raise SystemExit('Plugin version bump failed')
          plugin_path.write_text(plugin)

          readme_path = Path('readme.txt')
          readme = readme_path.read_text()
          readme = readme.replace('Stable tag: 1.0.9', 'Stable tag: 1.0.10')
          marker = '== Changelog ==\n\n'
          entry = """= 1.0.10 =
* Типографика блока программ приведена к LV News Suite: основной шрифт PT Sans, заголовки PT Serif.
* Размеры и межстрочные интервалы заголовков, описаний, рубрик, ссылок и кнопки синхронизированы со стилями новостей.
* Красная анимированная полоска сверху карточек программ удалена.

"""
          if marker not in readme:
              raise SystemExit('Readme changelog marker not found')
          readme = readme.replace(marker, marker + entry, 1)
          readme_path.write_text(readme)
          PY

      - name: Check PHP syntax
        run: |
          php -l lv-programs.php
          php -l includes/class-lvfp-plugin.php
          php -l includes/class-lvfp-admin.php

      - name: Verify requested scope
        run: |
          git diff --check
          git diff -- assets/css/frontend.css lv-programs.php readme.txt

      - name: Commit changes
        run: |
          git config user.name "People & Camels"
          git config user.email "bfcamel@yandex.ru"
          git add assets/css/frontend.css lv-programs.php readme.txt
          git commit -m "Align programs typography with news suite"
          git push origin HEAD:main
