name: Release 1.0.12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.12.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 1.0.12 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/frontend.css')
          css = css_path.read_text()
          old = "\tcolor: var(--lvfp-blue-deep);\n\tbackground: #fff;\n\tfont-family: 'PT Sans', Arial, sans-serif;"
          new = "\tcolor: var(--lvfp-blue-deep);\n\tfont-family: 'PT Sans', Arial, sans-serif;"
          if old not in css:
              raise SystemExit('Expected .lvfp white background not found')
          css = css.replace(old, new, 1)
          css_path.write_text(css)

          plugin_path = Path('lv-programs.php')
          plugin = plugin_path.read_text()
          if 'Version:     1.0.11' not in plugin or "define( 'LVFP_VERSION', '1.0.11' );" not in plugin:
              raise SystemExit('Expected plugin version 1.0.11 not found')
          plugin = plugin.replace('Version:     1.0.11', 'Version:     1.0.12', 1)
          plugin = plugin.replace("define( 'LVFP_VERSION', '1.0.11' );", "define( 'LVFP_VERSION', '1.0.12' );", 1)
          plugin_path.write_text(plugin)

          readme_path = Path('readme.txt')
          readme = readme_path.read_text()
          if 'Stable tag: 1.0.11' not in readme:
              raise SystemExit('Expected readme stable tag 1.0.11 not found')
          readme = readme.replace('Stable tag: 1.0.11', 'Stable tag: 1.0.12', 1)
          marker = '= 1.0.11 =\n'
          if marker not in readme:
              raise SystemExit('Expected 1.0.11 changelog section not found')
          section = """= 1.0.12 =\n* Белый фон внешнего блока программ удалён: [lv_programs_home] и [lv_programs_page] теперь наследуют фон страницы или контейнера Elementor.\n* Собственные фоны карточек и их текущее оформление сохранены.\n\n"""
          readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)
          PY

      - name: Check PHP syntax and version
        run: |
          php -l lv-programs.php
          php -l includes/class-lvfp-plugin.php
          php -l includes/class-lvfp-admin.php
          grep -F 'Version:     1.0.12' lv-programs.php
          grep -F "define( 'LVFP_VERSION', '1.0.12' );" lv-programs.php
          grep -F 'Stable tag: 1.0.12' readme.txt
          if sed -n '1,20p' assets/css/frontend.css | grep -F 'background: #fff;'; then
            echo 'Outer plugin background is still present'
            exit 1
          fi

      - name: Commit plugin update
        run: |
          git config user.name "People & Camels"
          git config user.email "bfcamel@yandex.ru"
          git add assets/css/frontend.css lv-programs.php readme.txt
          git commit -m "Release LV Programs 1.0.12"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-programs
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.zip' \
            ./ build/lv-programs/
          cd build
          zip -rq ../lv-programs-1.0.12.zip lv-programs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV Programs 1.0.12

          - Белый фон внешней секции программ удалён.
          - `[lv_programs_home]` и `[lv_programs_page]` теперь наследуют фон страницы или контейнера Elementor.
          - Собственные фоны карточек и их оформление не изменены.
          EOF

          if gh release view v1.0.12 >/dev/null 2>&1; then
            gh release delete v1.0.12 --yes --cleanup-tag
          fi

          gh release create v1.0.12 \
            lv-programs-1.0.12.zip \
            --target "$RELEASE_SHA" \
            --title "LV Programs 1.0.12" \
            --notes-file release-notes.md
