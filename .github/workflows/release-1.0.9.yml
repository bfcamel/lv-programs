name: Release 1.0.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.9.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -l lv-programs.php
          php -l includes/class-lvfp-plugin.php
          php -l includes/class-lvfp-admin.php

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-programs
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/lv-programs/
          cd build
          zip -rq ../lv-programs-1.0.9.zip lv-programs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV Programs 1.0.9

          - Фотографии в карточках стали выше, а zoom при наведении уменьшен, чтобы изображения меньше обрезались.
          - Скошенные углы карточек и фотографий убраны.
          - Возвращён светло-синий фирменный акцент #8DD4D3.
          - Кнопке «Все программы» возвращён прежний светло-синий цвет.
          - Верхняя анимированная полоска карточек теперь красная #C13B2E.
          - Описание нормализовано до 15 px при сохранении глобального семейства шрифта сайта.
          EOF

          if gh release view v1.0.9 >/dev/null 2>&1; then
            echo 'Release v1.0.9 already exists; nothing to do.'
            exit 0
          fi

          gh release create v1.0.9 \
            lv-programs-1.0.9.zip \
            --target "$GITHUB_SHA" \
            --title "LV Programs 1.0.9" \
            --notes-file release-notes.md
