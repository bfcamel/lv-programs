name: Release 1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.4.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-programs
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/lv-programs/
          cd build
          zip -rq ../lv-programs-1.0.4.zip lv-programs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV Programs 1.0.4

          - Карточки программ на главной странице теперь выводятся в два столбца на широких экранах.
          - На отдельной странице программ используется такая же двухколоночная сетка.
          - На планшетах и телефонах сетка автоматически перестраивается в один столбец.
          - Фотографии по-прежнему занимают всю высоту карточки.
          EOF

          if gh release view v1.0.4 >/dev/null 2>&1; then
            echo 'Release v1.0.4 already exists; nothing to do.'
            exit 0
          fi

          gh release create v1.0.4 \
            lv-programs-1.0.4.zip \
            --target "$GITHUB_SHA" \
            --title "LV Programs 1.0.4" \
            --notes-file release-notes.md
