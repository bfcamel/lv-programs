name: Release 1.0.8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.8.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -l lv-programs.php
          php -l includes/class-lvfp-plugin.php
          php -l includes/class-lvfp-admin.php

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-programs
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='*.zip' \
            ./ build/lv-programs/
          cd build
          zip -rq ../lv-programs-1.0.8.zip lv-programs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV Programs 1.0.8

          - Карточки программ полностью переработаны в более эффектный премиальный дизайн.
          - В карточках оставлены только два фирменных синих оттенка: #133641 и #18434E; жёлтые и мятные акценты удалены.
          - Добавлены крупная нумерация карточек, декоративные линии, усиленный градиент поверх фотографий, глубокие тени и более выразительная hover-анимация.
          - Сетка по две карточки в строку на десктопе сохранена.
          - Верхняя строка шапки блока снова красная (#C13B2E).
          - Типографика описания продолжает наследоваться от темы сайта.
          EOF

          if gh release view v1.0.8 >/dev/null 2>&1; then
            echo 'Release v1.0.8 already exists; nothing to do.'
            exit 0
          fi

          gh release create v1.0.8 \
            lv-programs-1.0.8.zip \
            --target "$GITHUB_SHA" \
            --title "LV Programs 1.0.8" \
            --notes-file release-notes.md
